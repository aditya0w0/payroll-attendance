  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #334155;
    }
    body {
      background-color: var(--bg);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
    }
    .flow-svg {
      transform-origin: 0 0;
      cursor: grab;
      user-select: none;
    }
    .flow-svg:active {
      cursor: grabbing;
    }
    .diagram-node {
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .diagram-node:hover rect:first-child {
      stroke: #38bdf8 !important;
      stroke-width: 2.5px !important;
      filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.25));
    }
    .diagram-edge:hover path {
      stroke-width: 3.5px !important;
      stroke-opacity: 1 !important;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6));
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>

    // Viewport Pan and Zoom
    let scale = 0.58;
    let panX = 30;
    let panY = 20;
    let isPanning = false;
    let startX = 0;
    let startY = 0;

    const layer = document.getElementById('svg-transform-layer');
    const container = document.getElementById('viewport-container');
    const zoomIndicator = document.getElementById('zoom-indicator');

    function updateTransform() {
      layer.style.transform = `matrix(${scale}, 0, 0, ${scale}, ${panX}, ${panY})`;
      zoomIndicator.textContent = Math.round(scale * 100) + '%';
    }

    function zoomIn() {
      scale = Math.min(scale * 1.25, 2.5);
      updateTransform();
    }

    function zoomOut() {
      scale = Math.max(scale / 1.25, 0.25);
      updateTransform();
    }

    function resetZoom() {
      scale = 0.58;
      panX = 30;
      panY = 20;
      updateTransform();
    }

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newScale = Math.max(0.25, Math.min(scale * zoomFactor, 2.5));
      
      const rect = container.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      panX = mouseX - (mouseX - panX) * (newScale / scale);
      panY = mouseY - (mouseY - panY) * (newScale / scale);
      scale = newScale;
      updateTransform();
    }, { passive: false });

    container.addEventListener('mousedown', (e) => {
      if (e.target.closest('#inspector-drawer')) return;
      isPanning = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
      layer.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      layer.style.cursor = 'grab';
    });

      [z1, z2, z3, conn].forEach(el => el.style.opacity = '1');

      if (zoneId === 'zone-1-models') {
        z1.style.opacity = '1';
        z2.style.opacity = '0.15';
        z3.style.opacity = '0.15';
        conn.style.opacity = '0.2';
        panX = 30; panY = 20; scale = 0.65;
      } else if (zoneId === 'zone-2-flows') {
        z1.style.opacity = '0.15';
        z2.style.opacity = '1';
        z3.style.opacity = '0.15';
        conn.style.opacity = '0.2';
        panX = -500; panY = 20; scale = 0.65;
      } else if (zoneId === 'zone-3-governance') {
        z1.style.opacity = '0.15';
        z2.style.opacity = '0.15';
        z3.style.opacity = '1';
        conn.style.opacity = '0.2';
        panX = -1100; panY = 20; scale = 0.65;
      } else {
        panX = 30; panY = 20; scale = 0.58;
      }
      updateTransform();
    }
  </script>
</body>
</html>
