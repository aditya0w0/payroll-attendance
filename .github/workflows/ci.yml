name: CI Quality & Security Gate

on:
  push:
    branches: [main, dev-new-ui]
  pull_request:
    branches: [main, dev-new-ui]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-typecheck:
    name: Typecheck & Unit Tests (Coverage Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run Vitest unit & security regression suite with coverage gate
        run: npm run test:unit:coverage

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-report
          path: coverage/
          retention-days: 14

  security-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Audit production dependencies (block Critical CVEs)
        run: npm audit --omit=dev --audit-level=critical

  build:
    name: Next.js 15 Production Build
    runs-on: ubuntu-latest
    needs: [test-and-typecheck]
    timeout-minutes: 10
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_build_placeholder"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci_build_placeholder"
      SESSION_SECRET: "ci-build-only-placeholder-secret-32chars"
      CRON_SECRET: "ci-build-only-placeholder-cron-secret"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Build Next.js application
        run: npm run build
